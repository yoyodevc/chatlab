worker_processes auto;
events { worker_connections 1024; }

http {
  # Access log without the query string ($uri instead of $request), so ?token=... is never written.
  log_format chatlab '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent rid=$request_id';
  access_log /var/log/nginx/access.log chatlab;
  error_log  /var/log/nginx/error.log warn;

  limit_req_zone $binary_remote_addr zone=api:10m   rate=10r/s;
  limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;
  limit_req_status 429;

  server {
    listen 8080;

    # Strict limit on login to slow password guessing.
    location = /api/v1/login {
      limit_req zone=login burst=5 nodelay;
      proxy_pass http://app:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
    }

    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://app:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
    }

    location /ws {
      proxy_pass http://app:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 60s;
    }

    # Browser client (served by the app)
    location / {
      proxy_pass http://app:3000;
      proxy_set_header Host $host;
    }
  }
}
