<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ChatLab</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font: 14px system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  #log { border: 1px solid #ccc; height: 320px; overflow-y: auto; padding: .5rem; margin: .75rem 0; background: #fafafa; }
  .err { color: #b00020; } .sys { color: #666; font-style: italic; }
  input { padding: .35rem; } #text { width: 60%; }
  .row { margin: .4rem 0; }
</style>
</head>
<body>
<h1>ChatLab</h1>

<div class="row" id="loginRow">
  <input id="user" placeholder="username" autocomplete="username">
  <input id="pass" placeholder="password" type="password" autocomplete="current-password">
  <button id="loginBtn">Log in</button>
</div>

<div class="row" id="roomRow" hidden>
  Logged in as <b id="me"></b>
  <input id="room" value="general" size="10">
  <button id="joinBtn">Join</button>
  <button id="leaveBtn">Leave</button>
</div>

<div id="log"></div>

<div class="row" id="sendRow" hidden>
  <input id="text" placeholder="message" maxlength="500">
  <button id="sendBtn">Send</button>
</div>

<script>
const $ = (id) => document.getElementById(id);
let ws = null;

function log(text, cls) {
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = text;           // textContent: never innerHTML, so messages cannot inject markup
  $('log').appendChild(d);
  $('log').scrollTop = $('log').scrollHeight;
}

$('loginBtn').onclick = async () => {
  const res = await fetch('/api/v1/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: $('user').value, password: $('pass').value }),
  });
  if (!res.ok) return log('Login failed (' + res.status + ')', 'err');
  const { token } = await res.json();
  $('pass').value = '';
  connect(token);
};

function connect(token) {
  ws = new WebSocket(`ws://${location.host}/ws?token=${encodeURIComponent(token)}`);
  ws.onopen = () => {
    $('me').textContent = $('user').value;
    $('loginRow').hidden = true;
    $('roomRow').hidden = false;
    $('sendRow').hidden = false;
    log('Connected', 'sys');
  };
  ws.onclose = (e) => {
    log(`Disconnected (code ${e.code})`, 'sys');
    $('loginRow').hidden = false;
    $('roomRow').hidden = true;
    $('sendRow').hidden = true;
  };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'message') log(`[${m.room}] ${m.from}: ${m.text}`);
    else if (m.type === 'error') log(`Error ${m.code}: ${m.detail}`, 'err');
    else log(JSON.stringify(m), 'sys');
  };
}

const sendJson = (o) => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));
$('joinBtn').onclick  = () => sendJson({ type: 'join',  room: $('room').value });
$('leaveBtn').onclick = () => sendJson({ type: 'leave', room: $('room').value });
$('sendBtn').onclick  = () => {
  sendJson({ type: 'message', room: $('room').value, text: $('text').value });
  $('text').value = '';
};
$('text').onkeydown = (e) => { if (e.key === 'Enter') $('sendBtn').click(); };
</script>
</body>
</html>
