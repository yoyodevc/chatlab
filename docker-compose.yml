services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

  app:
    build: ./app
    env_file: .env
    environment:
      ALLOWED_ORIGIN: http://localhost:8080
      CLIENT_DIR: /client
      HEARTBEAT_MS: ${HEARTBEAT_MS:-30000}
      TOKEN_TTL: ${TOKEN_TTL:-15m}
    volumes:
      - ./client:/client:ro
    expose:
      - "3000"   # internal only: no host port mapping
